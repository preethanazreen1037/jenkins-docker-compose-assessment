<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenkins CI/CD Assessment</title>
</head>

<body>
  <h1>Jenkins CI/CD Pipeline Assessment</h1>

  <h2>Deployment Version 3 - Successful!</h2>

  <p>
    Application deployed using Jenkins, Docker and Docker Compose.
  </p>

  <p>
    Backend Status:
    <strong id="status">Checking...</strong>
  </p>

  <script>
    fetch("/api/health")
      .then(response => response.json())
      .then(data => {
        document.getElementById("status").innerText = data.status;
      })
      .catch(() => {
        document.getElementById("status").innerText = "Unavailable";
      });
  </script>
</body>
</html>
